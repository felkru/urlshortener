<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copy your link - URL Shortener</title>
    <link href="/public/style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <a id="resultlink" href=""></a>
    <button onclick="copyToClipboard()">Click here to copy your link</button>
    <script>
      const resultlink = document.getElementById("resultlink");
      function copyToClipboard() {
        const rawKey = new URLSearchParams(window.location.search).get("url") || "";
        // Only allow safe key characters before using in a URL (prevents XSS via href)
        if (!/^[a-zA-Z0-9_-]{1,64}$/.test(rawKey)) return;
        const link = window.location.origin + "/" + rawKey;
        resultlink.textContent = link;
        resultlink.href = link;
        navigator.clipboard.writeText(link).catch(function () {
          // Fallback for browsers that block clipboard API
          const el = document.createElement("textarea");
          el.value = link;
          document.body.appendChild(el);
          el.select();
          document.execCommand("copy");
          document.body.removeChild(el);
        });
      }
    </script>
  </body>
</html>
